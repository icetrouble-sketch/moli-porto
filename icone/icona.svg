    <rect x="84"  y="150" width="54" height="236" rx="12"/>
    <rect x="176" y="150" width="54" height="282" rx="12"/>
    <rect x="268" y="150" width="54" height="214" rx="12"/>
    <rect x="360" y="150" width="54" height="262" rx="12"/>
  </g>
  <!-- punte nei colori dei terminal -->
  <rect x="84"  y="338" width="54" height="48" rx="12" fill="#A9CFC4"/>
  <rect x="176" y="384" width="54" height="48" rx="12" fill="#F4D59B"/>
  <rect x="268" y="316" width="54" height="48" rx="12" fill="#E8AFBC"/>
