  /* ================= NAVI DEL GIORNO =================
     Le navi arrivano dal giornale "Previsioni" della Capitaneria (navi.enc.json,
     cifrato con lo stesso codice). Per l'orario della visita scelto si calcola
     se la nave sara' in banchina: in tempo, a rischio, non ancora arrivata,
     gia' partita, in rada. Le navi si disegnano sulla banchina indicata. */
  var CHIAVE_ORA = "porto_ora_visita_v1";
  var NAVI = null, naviErrore = "", tab = "mappe";
  var oraScelta = (function(){
    var o = leggi(CHIAVE_ORA, null);
    return (o && o.giorno === oggi()) ? o.min : null;      // vale solo per oggi
  })();
  var BANCHINE = window.BANCHINE || {};
  var M_UNITA = 1.1132;                                   // metri per unita' della mappa
  var LINK_GIORNALE = "https://www.shipsinformationgenova.com/";
  var TIPI = { "CONT.": "Portacontainer", "RO/RO": "Ro-ro", "BULK": "Rinfusiera", "CHIM.": "Chimichiera",
               "TANK": "Cisterna", "CARGO": "Cargo", "PASS.": "Passeggeri", "PASS": "Passeggeri", "CRUISE": "Crociera" };
  var ICONA_NAVE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l2 5h14l2-5H3z"/><path d="M6 15V9h12v6M10 9V5h4v4"/></svg>';

  function oggi(){ var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function adesso(){ var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  function oraVisita(){ return oraScelta === null ? adesso() : oraScelta; }
  function hhmm(m){ m = Math.max(0, Math.min(1439, Math.round(m))); return ("0" + Math.floor(m / 60)).slice(-2) + ":" + ("0" + (m % 60)).slice(-2); }
  function giornoEsteso(iso){
    var m = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
    var p = String(iso || "").split("-");
    return p.length === 3 ? Number(p[2]) + " " + m[Number(p[1]) - 1] + " " + p[0] : iso;
  }
  /* orario del giornale -> [da, a, incerto, giorni da oggi] in minuti da oggi a mezzanotte.
     Le navi si portano dietro il giorno del giornale a cui si riferiscono i loro orari. */
  function giorniDa(g){
    if(!g) return 0;
    var a = new Date(g + "T12:00:00"), b = new Date(oggi() + "T12:00:00");
    return Math.round((a - b) / 864e5);
  }
  function orario(s, giorno){
    if(!s) return null;
    s = String(s).toUpperCase().trim();
    var off = giorniDa(giorno) * 1440, r = null;
    var m = s.match(/^(\d{1,2})[.:](\d{2})$/);
    if(m){ var v = Number(m[1]) * 60 + Number(m[2]); r = [v, v, false]; }
    else if(s.indexOf("ALBA") >= 0) r = [330, 450, true];
    else if(/A\.?\s?M/.test(s)) r = [0, 720, true];
    else if(/P\.?\s?M/.test(s)) r = [720, 1439, true];
    if(!r) return null;
    return [r[0] + off, r[1] + off, r[2], off / 1440];
  }
  function oraN(n, campo){ return orario(n[campo], n[campo + "_giorno"] || n.giorno || (NAVI && NAVI.data)); }
  function prefissoGiorno(r){
    var g = r[3] || 0;
    if(g === 0) return "";
    if(g === 1) return "domani ";
    if(g === -1) return "ieri ";
    var d = new Date(Date.now() + g * 864e5);
    return "il " + d.getDate() + "/" + (d.getMonth() + 1) + " ";
  }
  function quando(r){
    if(!r) return "";
    var base = r[0] - (r[3] || 0) * 1440;
    var t = !r[2] ? "alle " + hhmm(base) : (base === 330 ? "all'alba" : (base === 0 ? "in mattinata" : "nel pomeriggio o in serata"));
    return prefissoGiorno(r) + t;
  }
  function breve(r){
    if(!r) return "—";
    var base = r[0] - (r[3] || 0) * 1440;
    var t = !r[2] ? hhmm(base) : (base === 330 ? "alba" : (base === 0 ? "mattina" : "pomeriggio"));
    return prefissoGiorno(r) + t;
  }
  function dataBreve(iso){ var p = String(iso || "").split("-"); return p.length === 3 ? Number(p[2]) + "/" + Number(p[1]) : iso; }

  /* lo stato di una nave all'orario della visita (V = minuti di oggi).
     Se i dati sono vecchi (nessun aggiornamento da oltre 45 minuti) una nave "In tempo" o "A rischio" e' solo
     "Da confermare": la si vedeva ferma in banchina, ma nel frattempo puo' essere partita. Resta sulla mappa,
     tratteggiata, e non entra nel conteggio delle navi da visitare. */
  function statoNave(n, V){
    var st = statoNaveDaiDati(n, V);
    if((st.c === "ok" || st.c === "rischio") && datiVecchi()){
      var agg = NAVI && NAVI.aggiornato ? new Date(NAVI.aggiornato) : null;
      return { c: "conferma", t: "Da confermare",
               d: "All'ultimo aggiornamento (" + quandoDato(agg) + ") l'AIS la vedeva ferma in banchina, ma i dati sono fermi da " +
                  testoEta(etaDati()) + ": potrebbe essere già partita. Controlla su VesselFinder prima di andare." };
    }
    return st;
  }
  function statoNaveDaiDati(n, V){
    /* Una nave conta e si disegna sulla mappa solo se l'AIS la vede davvero ferma in banchina.
       Tutte le altre (in arrivo, che se ne vanno, solo previste dal giornale) stanno nell'elenco
       con il loro stato, ma non sulla banchina e non nel conteggio. */
    if(n.non_visitare)
      return { c: "nv", t: "Da non visitare", d: "È ferma in banchina ma non si visita: " + n.non_visitare + "." };
    var a = oraN(n, "arrivo"), p = oraN(n, "partenza");
    var ais = n.ais || null;
    var ferma = !!(ais && ais.ormeggiata);
    if(ferma) a = null;                                       // l'AIS la vede gia' ferma in banchina
    else if(ais && ais.eta_iso && a){
      // stima dalla posizione reale: si tiene la piu' tarda tra giornale e AIS
      var m = minutiDaIso(ais.eta_iso);
      if(m !== null && m > a[1]) a = rangeDaMinuti(m);
    }
    if(n.ritardo) p = null;                                   // doveva partire ma e' ancora li'
    if(n.dove.in_rada && !ferma)
      return { c: "rada", t: "In rada", d: "Arriva in rada" + (a ? " " + quando(a) : "") + " e aspetta il posto in banchina: per ora non si sale." };
    if(ais && ais.ancora && a && !ferma)
      return { c: "rada", t: "In rada", d: "Alle " + ais.quando.replace(".", ":") + " l'AIS la vede ferma in rada: aspetta di entrare." };
    if(ais && ais.in_uscita && !ferma)
      return { c: "uscita", t: "Si allontana", d: "Alle " + ais.quando.replace(".", ":") + " l'AIS la vede muoversi: sta lasciando la banchina." };
    if(p && V > p[1]) return { c: "partita", t: "Già partita", d: "Partenza " + quando(p) + "." };
    if(ferma && ais.silenzio)
      return { c: "prevista", t: "Segnale perso",
               d: "L'ultimo segnale AIS è delle " + ais.quando.replace(".", ":") + ": da allora l'AIS sente le altre navi del porto ma non lei. " +
                  "Potrebbe essere già partita: controlla su VesselFinder. Finché non la risente, non la segno sulla mappa né la conto." };
    if(!ferma){
      if(ais && (ais.manovra || ais.eta_iso))
        return { c: "avvicina", t: "In avvicinamento",
                 d: ais.manovra ? "Alle " + ais.quando.replace(".", ":") + " l'AIS la vede in manovra dentro il porto: sta per attraccare."
                                : "Alle " + ais.quando.replace(".", ":") + " l'AIS la vede in navigazione verso Genova" + (a ? ", arrivo stimato " + quando(a) : "") + ". Non è ancora in banchina." };
      return { c: "prevista", t: "Non ancora in banchina",
               d: (a ? "Il giornale la dà in arrivo " + quando(a) + ". " : "Il giornale la dà in porto. ") +
                  "L'AIS non l'ha vista ferma in banchina: finché non la vede, non la segno sulla mappa né la conto." };
    }
    if(p && V >= p[0] - 60)
      return { c: "rischio", t: "A rischio", d: p[2] ? "Parte " + quando(p) + ": l'orario non è preciso."
                                                     : "Parte " + quando(p) + ": potrebbe essere già in partenza." };
    if(n.dubbi && (n.dubbi.indexOf("arrivo") >= 0 || n.dubbi.indexOf("partenza") >= 0))
      return { c: "rischio", t: "A rischio", d: "Un orario del giornale è stato letto male: controlla su VesselFinder o sul giornale." };
    var d = "L'AIS la vede ferma in banchina alle " + ais.quando.replace(".", ":");
    if(n.in_porto_dal && n.in_porto_dal < oggi() && !a) d += ", in porto dal " + dataBreve(n.in_porto_dal);
    if(a) d += " dall'arrivo " + quando(a);
    if(p) d += ((a || n.in_porto_dal) ? "," : "") + " fino alla partenza " + quando(p);
    if(n.ritardo) d += ". Doveva già partire, ma è ancora ormeggiata";
    return { c: "ok", t: "In tempo", d: d + "." };
  }

  /* ---------- dati ---------- */
  function daB64(s){ var b = atob(s), u = new Uint8Array(b.length); for(var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function apriCifrate(obj){
    var k = window.PORTA && window.PORTA.chiave;
    if(!k) return Promise.reject(new Error("chiave"));
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: daB64(obj.iv) }, k, daB64(obj.ct))
      .then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); });
  }
  /* L'ultimo file delle navi scaricato resta sul telefono (cifrato com'e'), una copia sola: senza segnale (nei
     terminal capita) l'app mostra quella, con l'avviso e l'ora dei dati, invece di "Previsioni non disponibili". */
  var CH_COPIA_NAVI = "porto_navi_copia_v1";
  var caricando = false, naviSenzaSegnale = false;
  function caricaNavi(){
    if(caricando) return;
    caricando = true;
    var fonte = window.NAVI_CIFRATE ? Promise.resolve(window.NAVI_CIFRATE)
      : fetch("navi.enc.json?t=" + Date.now(), { cache: "no-store" }).then(function(r){
          if(!r.ok) throw new Error("http " + r.status); return r.text();
        }).then(function(testo){
          var o = JSON.parse(testo);
          try{ localStorage.setItem(CH_COPIA_NAVI, testo); }catch(e){}
          naviSenzaSegnale = false;
          return o;
        }).catch(function(e){
          var copia = null;
          try{ copia = localStorage.getItem(CH_COPIA_NAVI); }catch(e2){}
          if(!copia) throw e;
          naviSenzaSegnale = true;
          return JSON.parse(copia);
        });
    fonte.then(apriCifrate).then(function(d){
      NAVI = d; naviErrore = "";
      // le navi che non si visitano ma sono ferme alle nostre banchine seguono le altre (con il motivo)
      NAVI.navi = (NAVI.navi || []).concat((NAVI.non_visitare || []).map(function(n){
        n.non_visitare = n.motivo || "non si visita"; return n;
      }));
      // indice stabile per i tocchi sulla mappa
      NAVI.navi.forEach(function(n, i){ n._i = i; });
    }).catch(function(e){
      if(!NAVI) naviErrore = /chiave/.test(String(e && e.message)) ? "" : "Previsioni non disponibili ora (senza segnale?). Riprova più tardi.";
    }).then(function(){ caricando = false; aggiornaNavi(); });
  }

  /* ---------- posizione sulla banchina ---------- */
  function trattoDi(n){
    var b = BANCHINE[String(n.dove.molo || "").toUpperCase()];
    if(!b) return null;
    var lato = n.dove.lato;
    var nome = (lato && b[lato]) ? lato : (n.dove.punto === "testata" && b.testata ? "testata" :
               (b.ponente ? "ponente" : (b.levante ? "levante" : (b.testata ? "testata" : null))));
    if(!nome) return null;
    var l = b[nome], ac = (b.acqua && b.acqua[nome]) || [0, 0];
    var A = { x: px(l[0][1]), y: py(l[0][0]) }, B = { x: px(l[1][1]), y: py(l[1][0]) };
    var len = Math.hypot(B.x - A.x, B.y - A.y);
    return { chiave: n.dove.molo + "/" + nome, A: A, len: len,
             d: { x: (B.x - A.x) / len, y: (B.y - A.y) / len },
             acqua: { x: ac[1], y: -ac[0] }, suiLati: nome !== "testata" };
  }
  function disegnaNavi(V){
    if(!gNavi) return;
    gNavi.innerHTML = "";
    Array.prototype.forEach.call(gEtichette.querySelectorAll(".et-nave"), function(e){ e.remove(); });
    var nB = 0, nA = 0;
    if(!NAVI) return contaLegenda(0, 0);
    var perTratto = {};
    NAVI.navi.forEach(function(n){
      var st = statoNave(n, V);
      // sulla banchina solo le navi che l'AIS vede ferme li': da visitare (ok, rischio) o da non visitare (nv)
      if(st.c !== "ok" && st.c !== "rischio" && st.c !== "nv" && st.c !== "conferma") return;
      var tt = trova(n.dove.terminal); if(!tt || !agibile(tt)) return;
      var tr = trattoDi(n); if(!tr) return;
      var L = (Number(n.loa) || 150) / M_UNITA, W = (Number(n.larg) || 25) / M_UNITA;
      var s;
      if(tr.suiLati && n.dove.punto === "radice") s = 8 / M_UNITA;
      else if(tr.suiLati && (n.dove.punto === "testata" || n.dove.punto === "prolungamento")) s = tr.len - L;
      else s = (tr.len - L) / 2;
      // ferma in banchina secondo l'AIS: si disegna dove e' davvero
      var fisso = !!(n.ais && n.ais.ormeggiata && n.ais.s_m != null);
      if(fisso) s = n.ais.s_m / M_UNITA - L / 2;
      (perTratto[tr.chiave] = perTratto[tr.chiave] || []).push({ n: n, st: st, tr: tr, L: L, W: W, s: s, fisso: fisso });
    });
    Object.keys(perTratto).forEach(function(k){
      var lista = perTratto[k];
      // una dopo l'altra senza sovrapporsi
      var presenti = lista.sort(function(a, b){ return a.s - b.s; });
      for(var i = 1; i < presenti.length; i++){
        var prima = presenti[i - 1];
        if(!presenti[i].fisso) presenti[i].s = Math.max(presenti[i].s, prima.s + prima.L + 12 / M_UNITA);
      }
      presenti.forEach(function(o){
        disegnaScafo(o);
        if(o.st.c === "nv") nA++; else nB++;
      });
    });
    contaLegenda(nB, nA);
  }
  function contaLegenda(nB, nN){
    document.getElementById("legNave").hidden = !(nB || nN);
    document.getElementById("legNv").hidden = !nN;
    document.getElementById("legNvT").hidden = !nN;
  }
  function disegnaScafo(o){
    var tr = o.tr, L = o.L, W = o.W;
    var off = W / 2 + 5 / M_UNITA;                          // dal filo banchina al centro della nave
    var c0 = { x: tr.A.x + tr.d.x * o.s + tr.acqua.x * off, y: tr.A.y + tr.d.y * o.s + tr.acqua.y * off };
    var verso = /PRUA A TERRA/i.test(o.n.accosto || "") ? -1 : 1;  // prua verso la punta, salvo "prua a terra"
    var prua = Math.min(L * 0.14, 28 / M_UNITA);
    // scafo in coordinate locali: u lungo la banchina (0..L), w verso l'acqua
    var loc = [[0, -W/2], [L - prua, -W/2], [L, 0], [L - prua, W/2], [0, W/2]];
    if(verso < 0) loc = loc.map(function(q){ return [L - q[0], q[1]]; });
    var d = tr.d, a = tr.acqua;
    var pts = loc.map(function(q){ return (c0.x + d.x * q[0] + a.x * q[1]).toFixed(1) + " " + (c0.y + d.y * q[0] + a.y * q[1]).toFixed(1); });
    var g = tag("g", { "class": "nave " + o.st.c + (visitata(o.n) ? " visitata" : ""), "data-i": o.n._i });
    var segnata = o.st.c !== "nv" && !!chiaveScelta(o.n);                 // con la stella: "visito oggi"
    g.appendChild(tag("path", { d: "M" + pts.join(" L") + " Z" }));
    gNavi.appendChild(g);
    // nome della nave, a dimensione fissa sullo schermo
    var cx = c0.x + d.x * L / 2 + a.x * (W / 2 + 14), cy = c0.y + d.y * L / 2 + a.y * (W / 2 + 14);
    var e = tag("g", { "class": "et-nave " + o.st.c + (segnata ? " scelta" : ""), "data-x": cx, "data-y": cy });
    var r = tag("rect", { rx: 6, ry: 6 }), t = tag("text", {});
    var etichetta = o.st.c === "nv" ? o.n.nome + " · da non visitare" : (segnata ? "★ " : "") + o.n.nome;
    t.textContent = etichetta;
    e.appendChild(r); e.appendChild(t);
    gEtichette.appendChild(e);
    o.n._xy = { x: c0.x + d.x * L / 2, y: c0.y + d.y * L / 2 };
    var w = Math.max(30, etichetta.length * 6.4);
    r.setAttribute("x", -(w / 2 + 6)); r.setAttribute("width", w + 12);
    r.setAttribute("y", -9); r.setAttribute("height", 18);
  }

  /* ---------- schede in alto ---------- */
  function impostaTab(t){
    tab = t;
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){
      var on = b.getAttribute("data-tab") === t;
      b.classList.toggle("on", on); b.setAttribute("aria-selected", on ? "true" : "false");
    });
    var navi = t === "navi" || t === "oggi";           // le due schede con l'elenco delle navi
    document.getElementById("filtri").hidden = navi;
    document.getElementById("orario").hidden = !navi;
    document.getElementById("pannelloNavi").hidden = !navi;
    mappaEl.hidden = navi;
    if(navi){
      chiudi();
      document.getElementById("giro").hidden = true;
      carosello.hidden = true; vuoto.hidden = true;
      aggiornaNavi();
      document.getElementById("pannelloNavi").scrollTop = 0;
    }else{
      aggiornaTutto();
      programmaVista();
    }
  }
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){
    b.addEventListener("click", function(){ impostaTab(b.getAttribute("data-tab")); });
  });

  var inOra = document.getElementById("oraVisita"), btAdesso = document.getElementById("oraAdesso");
  inOra.addEventListener("change", function(){
    var m = /^(\d{2}):(\d{2})/.exec(inOra.value || "");
    oraScelta = m ? Number(m[1]) * 60 + Number(m[2]) : null;
    scrivi(CHIAVE_ORA, oraScelta === null ? null : { giorno: oggi(), min: oraScelta });
    aggiornaNavi();
  });
  btAdesso.addEventListener("click", function(){
    oraScelta = null; scrivi(CHIAVE_ORA, null); aggiornaNavi();
  });
  document.getElementById("pillNavi").addEventListener("click", function(){ impostaTab("navi"); });

  /* ---------- quanto sono vecchi i dati ----------
     Di giorno il file si aggiorna ogni 15 minuti, di notte tre volte (23, 3, 6). Se l'ultimo aggiornamento
     e' piu' vecchio di 45 minuti lo si dice, con il giorno: "aggiornato alle 21:03" aperto alle 6 del mattino
     sembrerebbe un dato fresco, invece le navi partite di notte risultano ancora in banchina. */
  var DATI_VECCHI_MIN = 45;
  function etaDati(){
    var a = NAVI && NAVI.aggiornato ? new Date(NAVI.aggiornato) : null;
    return a && !isNaN(a) ? Math.max(0, Math.round((Date.now() - a.getTime()) / 60000)) : null;
  }
  function datiVecchi(){ var e = etaDati(); return e !== null && e > DATI_VECCHI_MIN; }
  function testoEta(min){
    if(min < 60) return min + " min";
    var h = Math.floor(min / 60), m = min % 60;
    if(h >= 10 || !m) return h + (h === 1 ? " ora" : " ore");
    return h + " h " + m + " min";
  }
  /* "alle 21:03", "ieri alle 21:03", "il 26/10 alle 21:03" */
  function quandoDato(d){
    if(!d || isNaN(d)) return "";
    var g = giorniDa(oggiDi(d)), t = "alle " + hhmm(d.getHours() * 60 + d.getMinutes());
    return g === 0 ? t : (g === -1 ? "ieri " + t : "il " + d.getDate() + "/" + (d.getMonth() + 1) + " " + t);
  }

  /* ---------- pannello delle previsioni ---------- */
  function aggiornaNavi(){
    var V = oraVisita();
    if(document.activeElement !== inOra) inOra.value = hhmm(V);
    btAdesso.classList.toggle("on", oraScelta === null);
    disegnaNavi(V);
    aggiornaVista();
    // riga sulle schede dei terminal e pillola sulla mappa
    var conta = {}, tot = 0, vecchi = datiVecchi();
    var cosa = vecchi ? function(k){ return k === 1 ? " nave da confermare" : " navi da confermare"; }
                      : function(k){ return k === 1 ? " nave da visitare" : " navi da visitare"; };
    if(NAVI) NAVI.navi.forEach(function(n){
      var tt = trova(n.dove.terminal); if(!tt || !agibile(tt)) return;
      var c = statoNave(n, V).c;
      if((c === "ok" || c === "rischio" || c === "conferma") && !visitata(n)){ conta[n.dove.terminal] = (conta[n.dove.terminal] || 0) + 1; tot++; }
    });
    tutti.forEach(function(t){
      var r = carosello.querySelector('.card[data-id="' + t.id + '"] .navi-riga');
      if(!r) return;
      var k = conta[t.id] || 0;
      r.hidden = !k || !agibile(t);
      r.innerHTML = ICONA_NAVE + "<span>" + k + cosa(k) + (vecchi ? "" : " alle " + hhmm(V)) + "</span>";
    });
    var pill = document.getElementById("pillNavi");
    pill.hidden = !NAVI;
    pill.classList.toggle("vecchio", vecchi);
    pill.innerHTML = ICONA_NAVE + "<span>" + (vecchi ? "Dati di " + testoEta(etaDati()) + " fa · " + tot + cosa(tot)
                                                      : tot + cosa(tot) + " alle " + hhmm(V)) +
                     (naviSenzaSegnale ? " · senza segnale" : "") + "</span>";
    aggiornaConteggioOggi(V);
    // mentre si scrive il nome nel campo delle visite il pannello non si ridisegna (si perderebbe quello che si scrive)
    var scrive = document.activeElement && document.activeElement.id === "nomeVisite";
    if((tab === "navi" || tab === "oggi") && !scrive) disegnaPannello(V);
    if(schedaNave !== null && scheda.classList.contains("on") && document.getElementById("btChiudi")){
      var iN = trovaNave(schedaNave);
      if(iN < 0){
        var via = schedaNave.nome; schedaNave = null; chiudi();
        avvisa(via + " non è più nell'elenco: forse è partita.", null);
      }else{ var sc = scheda.scrollTop; apriNave(iN); scheda.scrollTop = sc; }
    }
  }

  function disegnaPannello(V){
    var el = document.getElementById("pannelloNavi");
    if(!NAVI){
      el.innerHTML = '<p class="pn-info">' + (naviErrore ? esc(naviErrore) : "Carico le previsioni…") + '</p>';
      return;
    }
    var h = "";
    if(NAVI.esempio)
      h += '<div class="nota attenzione" style="margin:0 0 10px"><b>Esempio.</b> Navi lette dal giornale del ' + esc(giornoEsteso(NAVI.data)) +
           '. L\'aggiornamento automatico e le posizioni in tempo reale si attivano quando colleghiamo aisstream.</div>';
    else if((NAVI.giornali || [NAVI.data]).indexOf(oggi()) < 0)
      h += '<div class="nota attenzione" style="margin:0 0 10px">Il giornale è del <b>' + esc(giornoEsteso(NAVI.data)) +
           '</b>: quello di oggi non è ancora arrivato. Gli orari valgono per quel giorno.</div>';
    var agg = NAVI.aggiornato ? new Date(NAVI.aggiornato) : null;
    if(naviSenzaSegnale)
      h += '<div class="nota attenzione" style="margin:0 0 10px"><b>Senza segnale.</b> Mostro gli ultimi dati salvati su questo telefono ' +
           '(aggiornati ' + esc(quandoDato(agg)) + '). Riprovo da solo appena torna la rete.</div>';
    if(datiVecchi())
      h += '<div class="nota attenzione" style="margin:0 0 10px"><b>Dati non aggiornati da ' + testoEta(etaDati()) + '.</b> Ultimo aggiornamento ' +
           esc(quandoDato(agg)) + '. Le navi possono essere già partite o arrivate: controlla su VesselFinder.</div>';
    h += '<p class="pn-info">Giornale del <b>' + esc(giornoEsteso(NAVI.data)) + '</b>' +
         (agg && !isNaN(agg) ? ' · aggiornato ' + esc(quandoDato(agg)) : '') +
         ' · posizioni AIS ' + (NAVI.ais ? 'attive' : 'non ancora attive') + '</p>';

    // scheda "Navi di oggi": solo le navi con la stella; quelle scelte restano qui anche se il molo non e' piu' agibile
    var soloOggi = tab === "oggi";
    var scelte = Object.keys(sceltaAggiornata().navi);
    if(soloOggi && !scelte.length){
      h += '<div class="oggi-vuoto">' + ICONA_STELLA(false, 30) +
           '<p><b>Nessuna nave scelta per oggi</b></p>' +
           '<p>In «Previsioni navi» tocca la stella accanto alla nave che vuoi visitare: la ritrovi qui, con orario e stato sempre aggiornati.</p>' +
           '<p>La scelta si azzera da sola a mezzanotte.</p>' +
           '<button type="button" class="bottone b-secondario" data-vai="navi">Vai alle previsioni</button></div>';
      el.innerHTML = h;
      collegaStelle(el);
      return;
    }

    var conti = { ok: 0, rischio: 0, conferma: 0, avvicina: 0, prevista: 0, fatte: 0 }, vecchi = datiVecchi();
    var gruppi = {}, trovate = {};
    NAVI.navi.forEach(function(n){
      if(soloOggi){
        var q = chiaveScelta(n);
        if(!q) return;
        trovate[q] = true;
      }
      var t = trova(n.dove.terminal);
      if(!t || (!soloOggi && !agibile(t))) return;
      var st = statoNave(n, V);
      if(visitata(n)) conti.fatte++;
      else if(conti[st.c] !== undefined) conti[st.c]++;
      (gruppi[t.id] = gruppi[t.id] || []).push({ n: n, st: st });
    });
    if(soloOggi) h += '<p class="pn-info">Le navi che hai scelto per oggi, con lo stato all\'orario della visita. La scelta si azzera a mezzanotte.</p>';
    h += '<div class="riepilogo">' +
         (vecchi ? '<div><b>' + conti.conferma + '</b><span>Da confermare</span></div>'
                 : '<div><b>' + conti.ok + '</b><span>In tempo</span></div>' +
                   '<div><b>' + conti.rischio + '</b><span>A rischio</span></div>') +
         '<div><b>' + (conti.avvicina + conti.prevista) + '</b><span>Non ancora qui</span></div>' +
         '<div><b>' + conti.fatte + '</b><span>Visitate</span></div></div>';

    var ordine = { ok: 0, conferma: 0, rischio: 1, avvicina: 2, prevista: 3, rada: 4, uscita: 5, nv: 6, partita: 7 };
    var senza = [];
    tutti.forEach(function(t){
      if(!soloOggi && !agibile(t)) return;
      var g = gruppi[t.id];
      if(!g){ if(!soloOggi) senza.push(t.nome); return; }
      g.sort(function(a, b){ return (visitata(a.n) - visitata(b.n)) || (ordine[a.st.c] - ordine[b.st.c]); });
      var utili = g.filter(function(o){ return (o.st.c === "ok" || o.st.c === "rischio" || o.st.c === "conferma") && !visitata(o.n); }).length;
      h += '<section class="gruppo"><h3><span class="pastiglia" style="background:' + t.colore + '"></span>' + esc(t.nome) +
           '<span class="n">' + utili + (vecchi ? ' da confermare' : ' da visitare') + '</span></h3>';
      g.forEach(function(o){ h += cartaNave(o.n, o.st); });
      h += '</section>';
    });
    if(senza.length) h += '<p class="nessuna">Nessuna nave prevista: ' + esc(senza.join(", ")) + '.</p>';
    if(soloOggi){
      // scelte che l'elenco di adesso non contiene piu' (probabilmente partite): restano visibili finche' non si tolgono
      scelte.forEach(function(q){
        if(trovate[q]) return;
        var e = sceltaAggiornata().navi[q];
        h += '<div class="nv spenta"><div class="su"><h4>' + esc(e.nome) + '</h4><span class="stato-n partita">Non più nell\'elenco</span></div>' +
             '<p class="perche">Non compare più nelle previsioni: forse è partita o l\'AIS non la vede più. Controlla su VesselFinder.</p>' +
             '<div class="bottoni"><button type="button" class="bottone b-secondario" data-togli="' + esc(q) + '">Togli dalla lista</button>' +
             '<a class="bottone b-nave" target="_blank" rel="noopener" href="' + linkVF(e) + '">Vedi su VesselFinder</a></div></div>';
      });
      h += '<button type="button" class="bottone b-secondario" style="width:100%;margin:2px 0 14px" data-svuota="1">Togli tutte le navi di oggi</button>';
    }
    h += '<div class="legenda-stati">' +
         '<div><span class="stato-n scelta-leg">★ Stella</span>tocca la stella per segnare le navi che visiti oggi: le ritrovi nella scheda «Navi di oggi»</div>' +
         '<div><span class="stato-n ok">In tempo</span>l\'AIS la vede ferma in banchina e ci resta fino all\'orario della visita</div>' +
         '<div><span class="stato-n conferma">Da confermare</span>i dati non si aggiornano da oltre 45 minuti: era ferma in banchina all\'ultimo aggiornamento, ma potrebbe essere partita</div>' +
         '<div><span class="stato-n rischio">A rischio</span>ferma in banchina, ma parte vicino all\'orario della visita o l\'orario non è preciso</div>' +
         '<div><span class="stato-n avvicina">In avvicinamento</span>l\'AIS la vede arrivare: non è ancora in banchina, non è sulla mappa né nel conteggio</div>' +
         '<div><span class="stato-n prevista">Non ancora in banchina</span>la dà il giornale ma l\'AIS non la vede ferma in banchina (non è sulla mappa né nel conteggio)</div>' +
         '<div><span class="stato-n prevista">Segnale perso</span>era ferma in banchina, ma da almeno 45 minuti (3 giri, di più se di solito si sente male) l\'AIS sente le altre navi e non lei: potrebbe essere partita (non è sulla mappa né nel conteggio)</div>' +
         '<div><span class="stato-n rada">In rada</span>aspetta fuori dal porto il posto in banchina</div>' +
         '<div><span class="stato-n uscita">Si allontana</span>l\'AIS la vede lasciare la banchina</div>' +
         '<div><span class="stato-n nv">Da non visitare</span>ferma in banchina ma chemical, cisterna, nave passeggeri o ro-ro con passeggeri</div></div>' +
         '<a class="bottone b-secondario" style="margin-top:12px" target="_blank" rel="noopener" href="' + LINK_GIORNALE + '">Note della Capitaneria (shipsinformationgenova)</a>' +
         (FOGLIO ? '<div class="nome-visite"><label for="nomeVisite">Il tuo nome nel foglio delle visite (facoltativo)</label>' +
                   '<input id="nomeVisite" type="text" maxlength="30" autocomplete="off" placeholder="es. Mele"></div>' : '') +
         (CODA.length ? '<p class="pn-info" style="margin-top:10px">' + CODA.length + ' modifiche alle visite in attesa di segnale.</p>' : '');
    el.innerHTML = h;
    Array.prototype.forEach.call(el.querySelectorAll("[data-mappa]"), function(b){
      b.addEventListener("click", function(){ mostraSullaMappa(Number(b.getAttribute("data-mappa"))); });
    });
    collegaBottoniVisita(el);
    collegaStelle(el);
    var nm = document.getElementById("nomeVisite");
    if(nm){
      nm.value = leggi(CH_NOME, "") || "";
      nm.addEventListener("change", function(){ scrivi(CH_NOME, nm.value.trim()); });
    }
  }

  function cartaNave(n, st){
    var fatta = visitata(n);
    var nonVisita = st.c === "nv";
    var spenta = st.c === "partita" || st.c === "prevista" || st.c === "rada" || st.c === "uscita" || nonVisita || fatta;
    var a = oraN(n, "arrivo"), p = oraN(n, "partenza");
    var sullaMappa = (st.c === "ok" || st.c === "rischio" || st.c === "conferma" || nonVisita) && trattoDi(n);
    return '<div class="nv' + (spenta ? " spenta" : "") + (fatta ? " fatta" : "") + (!nonVisita && chiaveScelta(n) ? " scelta" : "") + '">' +
      '<div class="su"><h4>' + esc(n.nome) + '</h4><span class="stato-n ' + st.c + '">' + st.t + '</span>' +
      (nonVisita ? '' : bottoneStella(n)) + '</div>' +
      '<p class="det">' + esc(TIPI[n.tipo] || n.tipo || "") + (n.loa ? ' · ' + Math.round(n.loa) + ' m' : '') + ' · ' + esc(n.accosto) + '</p>' +
      '<p class="orari">' + (a ? '<span>Arrivo <b>' + breve(a) + '</b></span>' :
                             '<span>' + (n.in_porto_dal && n.in_porto_dal < oggi() ? 'In porto dal <b>' + dataBreve(n.in_porto_dal) + '</b>' : 'Già in porto') + '</span>') +
                            (p ? '<span>Partenza <b>' + breve(p) + '</b></span>' : '') + '</p>' +
      '<p class="perche">' + esc(st.d) + (n.nota ? ' ' + esc(n.nota) : '') + '</p>' +
      rigaArrivo(n) +
      (n.ais && !rigaArrivo(n) ? '<p class="ais-riga">' + esc(testoAIS(n.ais)) + '</p>' : '') +
      (n.conferma ? '<p class="ais-riga">' + esc(testoConferma(n.conferma)) + '</p>' : '') +
      (nonVisita ? '' : rigaVisite(n)) +
      '<div class="bottoni">' + (nonVisita ? '' : bottoneVisita(n)) +
        (sullaMappa ? '<button type="button" class="bottone b-secondario" data-mappa="' + n._i + '">Sulla mappa</button>' : '') +
        '<a class="bottone b-nave" target="_blank" rel="noopener" href="' + linkVF(n) + '">Vedi su VesselFinder</a>' +
      '</div></div>';
  }
  function testoConferma(c){
    return "Sito del porto: " + (c.tipo === "partenza" ? "partenza" : "arrivo") + " " +
           (c.giorno && c.giorno !== oggi() ? "il " + dataBreve(c.giorno) + " " : "") + "alle " + String(c.ora).replace(".", ":") +
           (c.stato ? " (" + c.stato + ")" : "") + (c.ormeggio ? " · " + c.ormeggio : "") + ".";
  }
  function testoAIS(a){
    var t = "Posizione AIS delle " + String(a.quando || "").replace(".", ":") + ": ";
    if(a.ormeggiata) return t + (a.silenzio ? "ferma in banchina, poi più nessun segnale." : "ferma in banchina.");
    if(a.in_uscita) return t + "in movimento: sta lasciando la banchina.";
    if(a.manovra) return t + "in manovra dentro il porto.";
    if(a.ancora) return t + "ferma in rada, a " + a.dist_nm + " miglia.";
    var e = a.eta_iso ? minutiDaIso(a.eta_iso) : null;
    return t + "a " + a.dist_nm + " miglia, " + a.vel + " nodi" + (e !== null ? ", arrivo stimato " + quando(rangeDaMinuti(e)) : "") + ".";
  }
  function linkVF(n){
    return /^\d{7}$/.test(n.imo || "") ? "https://www.vesselfinder.com/vessels/details/" + n.imo
                                       : "https://www.vesselfinder.com/vessels?name=" + encodeURIComponent(n.nome);
  }
  function mostraSullaMappa(i){
    impostaTab("mappe");
    var n = NAVI && NAVI.navi[i];
    if(!n || !n._xy) return;
    seleziona(null, true);
    centraSuXY(n._xy.x, n._xy.y, 3.2);
    var g = gNavi.querySelector('.nave[data-i="' + i + '"]');
    if(g){ g.classList.remove("lampeggia"); void g.getBoundingClientRect(); g.classList.add("lampeggia"); }
  }

  /* ---------- scheda della nave (toccando la nave sulla mappa) ---------- */
  function apriNave(i){
    var n = NAVI && NAVI.navi[i];
    if(!n) return;
    var t = trova(n.dove.terminal);
    var V = oraVisita(), st = statoNave(n, V);
    var a = oraN(n, "arrivo"), p = oraN(n, "partenza");
    scheda.innerHTML =
      '<div class="testa-scheda" id="testaScheda"><div class="maniglia"></div>' +
        '<button class="chiudi-scheda" id="btChiudi" type="button" aria-label="Chiudi la scheda">' +
        '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>' +
        '</button></div>' +
      '<div class="barra" style="background:#3B5F86"></div>' +
      '<h2>' + esc(n.nome) + '</h2>' +
      '<p class="sub">' + esc(TIPI[n.tipo] || n.tipo || "") + (t ? ' · ' + esc(t.nome) : '') + '</p>' +
      '<div class="nota' + (st.c === "ok" ? "" : " attenzione") + '"><span class="stato-n ' + st.c + '">' + st.t +
        '</span> alle ' + hhmm(V) + '. ' + esc(st.d) + '</div>' +
      (st.c === "nv" ? '' : rigaVisite(n)) + rigaArrivo(n) +
      '<div class="azioni">' + (st.c === "nv" ? '' : bottoneVisita(n) + bottoneOggi(n)) +
        '<a class="bottone b-nave" target="_blank" rel="noopener" href="' + linkVF(n) + '">Vedi su VesselFinder</a>' +
        (t ? '<a class="bottone b-primario" target="_blank" rel="noopener" href="' + linkGPS(t) + '">' + ICONA_VAI + 'Come ci arrivo (' + esc(t.nome) + ')</a>' : '') +
      '</div>' +
      (n.ais ? riga("AIS", esc(testoAIS(n.ais))) : "") +
      riga("Accosto", esc(n.accosto)) +
      (n.spostamento ? riga("Spostamento", esc(n.spostamento)) : "") +
      (n.conferma ? riga("Sito porto", esc(testoConferma(n.conferma))) : "") +
      riga("Arrivo", a ? quando(a).replace(/^alle /, "") : (n.in_porto_dal ? "in porto dal " + dataLunga(n.in_porto_dal) : "già in porto")) +
      riga("Partenza", p ? quando(p).replace(/^alle /, "") : "non prevista oggi") +
      (n.nota ? riga("Nota", esc(n.nota)) : "") +
      riga("Misure", (n.loa ? n.loa + " m" : "—") + (n.larg ? " × " + n.larg + " m" : "")) +
      riga("IMO", esc(n.imo || "—")) +
      (n.agenzia ? riga("Agenzia", esc(n.agenzia)) : "") +
      '<p class="piede">Dal giornale della Capitaneria del ' + esc(giornoEsteso(NAVI.data)) + '.<br>' +
      '<a href="' + LINK_GIORNALE + '" target="_blank" rel="noopener" style="color:inherit">shipsinformationgenova.com</a></p>';
    if(!scheda.classList.contains("on")){ try{ history.pushState({ scheda: true }, ""); }catch(e){} }
    scheda.classList.add("on"); velo.classList.add("on"); scheda.scrollTop = 0;
    document.getElementById("btChiudi").addEventListener("click", function(){ chiudi(); });
    collegaBottoniVisita(scheda);
    collegaStelle(scheda);
    schedaNave = idNave(n);
    preparaTrascinamento();
  }
  /* La scheda aperta si ricorda la nave (IMO, MMSI, nome), non il suo posto nell'elenco: quando arrivano dati
     nuovi l'elenco puo' cambiare ordine (una nave partita, una arrivata) e con il posto la scheda mostrava un'altra
     nave, con il suo tasto "Visitata". */
  var schedaNave = null;
  function idNave(n){
    return { imo: /^\d{7}$/.test(n.imo || "") ? n.imo : "", mmsi: n.mmsi || "", chiave: chiaveNave(n.nome, ""), nome: n.nome };
  }
  function trovaNave(id){
    if(!NAVI || !id) return -1;
    var l = NAVI.navi, i;
    if(id.imo) for(i = 0; i < l.length; i++) if(l[i].imo === id.imo) return i;
    if(id.mmsi) for(i = 0; i < l.length; i++) if(l[i].mmsi === id.mmsi) return i;
    for(i = 0; i < l.length; i++) if(chiaveNave(l[i].nome, "") === id.chiave && !(id.imo && /^\d{7}$/.test(l[i].imo || ""))) return i;
    return -1;
  }


  /* ================= ARRIVI: QUANTO E' SICURO? =================
     Per chi deve andare a visitare una nave in arrivo: si incrocia l'orario del
     giornale con la posizione reale (AIS) e con la conferma del sito del porto. */
  function minutiDaIso(iso){
    var d = new Date(iso); if(isNaN(d)) return null;
    var mezzanotte = new Date(oggi() + "T00:00:00");
    return Math.round((d - mezzanotte) / 60000);
  }
  function rangeDaMinuti(m){ var off = Math.floor(m / 1440); return [m, m, false, off]; }
  function valutaArrivo(n){
    var g = oraN(n, "arrivo");
    var a = n.ais || null, c = (n.conferma && n.conferma.tipo === "arrivo") ? n.conferma : null;
    if(!g || (a && (a.ormeggiata || a.in_uscita))) return null;
    // orario d'arrivo gia' passato da un pezzo e nessuna posizione che dica il contrario: e' in porto
    if(adesso() > g[1] + 90 && !(a && (a.eta_iso || a.ancora || a.lontana || a.manovra))) return null;
    var dove = a ? " (a " + a.dist_nm + " miglia, " + a.vel + " nodi, AIS delle " + String(a.quando).replace(".", ":") + ")" : "";
    var conf = c ? " Il sito del porto la dà " + (c.stato === "CONF" ? "confermata" : "segnalata via radio") + " per le " + String(c.ora).replace(".", ":") + "." : "";
    if(a && a.manovra) return { liv: "sicuro", t: "Sta entrando in porto adesso" + dove + "." + conf };
    if(a && a.ancora) return { liv: "ritardo", t: "Ferma in rada" + dove + ": entra quando si libera il posto in banchina." + conf };
    if(a && a.eta_iso){
      var m = minutiDaIso(a.eta_iso);
      if(m !== null){
        var r = rangeDaMinuti(m), ritardo = m - g[1];
        if(ritardo > 60) return { liv: "ritardo", t: "In ritardo: secondo la posizione reale arriva " + quando(r) + ", non " + quando(g) + dove + "." + conf };
        return { liv: "sicuro", t: "In arrivo come previsto: stimata " + quando(r) + dove + "." + conf };
      }
    }
    if(a && a.lontana) return { liv: "ritardo", t: "Ancora lontana" + dove + ": difficile che arrivi " + quando(g) + "." + conf };
    if(a) return { liv: "incerto", t: "Vista dall'AIS ma non ancora diretta qui" + dove + "." + conf };
    if(c) return { liv: "sicuro", t: conf.trim() };
    return { liv: "incerto", t: "Arrivo solo previsto dal giornale: la nave non risulta ancora nei dati AIS che riceviamo. Può essere ancora lontana o fuori dalla copertura del servizio (che non garantisce di vedere tutte le navi): controlla su VesselFinder." };
  }
  function rigaArrivo(n){
    var v = valutaArrivo(n);
    return v ? '<p class="arrivo-riga ' + v.liv + '"><b>' + ({ sicuro: "Arrivo sicuro", ritardo: "Arrivo in dubbio", incerto: "Arrivo da confermare" })[v.liv] +
               ':</b> ' + esc(v.t) + '</p>' : '';
  }

  /* ================= NAVI DI OGGI (la stella) =================
     Con la stella si sceglie, su questo telefono, le navi che si vogliono visitare oggi:
     finiscono nella scheda "Navi di oggi" e sulla mappa hanno il nome in giallo.
     La scelta vale per la data di oggi e si azzera da sola al cambio di giorno.
     Si ricorda anche nome e IMO, cosi' una nave sparita dall'elenco resta visibile. */
  var CH_OGGI = "porto_navi_oggi_v1";
  var SCELTE = (function(){
    var s = leggi(CH_OGGI, null);
    return (s && s.giorno === oggi() && s.navi && typeof s.navi === "object") ? s : { giorno: oggi(), navi: {} };
  })();
  function sceltaAggiornata(){
    if(SCELTE.giorno !== oggi()){ SCELTE = { giorno: oggi(), navi: {} }; scrivi(CH_OGGI, SCELTE); }
    return SCELTE;
  }
  /* la chiave con cui la nave e' salvata, se e' stata scelta (anche se nel frattempo
     le e' stato assegnato l'IMO). Due navi con IMO diversi non si confondono mai. */
  function chiaveScelta(n){
    var s = sceltaAggiornata(), k = chiaveNave(n.nome, n.imo);
    if(s.navi[k]) return k;
    var nome = chiaveNave(n.nome, ""), trovata = null;
    Object.keys(s.navi).forEach(function(q){
      var e = s.navi[q];
      if(n.imo && e.imo && n.imo === e.imo) trovata = q;
      else if((!n.imo || !e.imo) && chiaveNave(e.nome, "") === nome) trovata = q;
    });
    return trovata;
  }
  function impostaScelta(n, si){
    var s = sceltaAggiornata(), q = chiaveScelta(n);
    if(si){ if(!q) s.navi[chiaveNave(n.nome, n.imo)] = { nome: n.nome, imo: n.imo || "" }; }
    else if(q) delete s.navi[q];
    scrivi(CH_OGGI, s);
    aggiornaNavi();
  }
  function aggiornaConteggioOggi(V){
    var el = document.getElementById("contaOggi"), k = 0;
    if(NAVI) NAVI.navi.forEach(function(n){
      if(chiaveScelta(n) && !visitata(n) && statoNave(n, V).c !== "nv") k++;
    });
    el.hidden = !k; el.textContent = k;                    // quante restano da visitare
  }
  function ICONA_STELLA(piena, px){
    return '<svg width="' + px + '" height="' + px + '" viewBox="0 0 24 24" fill="' + (piena ? "currentColor" : "none") +
           '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
           '<path d="M12 2.8l2.8 5.9 6.4.9-4.7 4.5 1.2 6.4L12 17.3l-5.7 3.2 1.2-6.4L2.8 9.6l6.4-.9z"/></svg>';
  }
  /* stella in alto a destra sulla carta della nave */
  function bottoneStella(n){
    var on = !!chiaveScelta(n);
    return '<button type="button" class="stella' + (on ? " on" : "") + '" data-stella="' + n._i + '" aria-pressed="' + on +
           '" aria-label="' + (on ? "Togli dalle navi di oggi" : "Visito questa nave oggi") + '">' + ICONA_STELLA(on, 24) + '</button>';
  }
  /* pulsante con la scritta, nella scheda che si apre dalla mappa */
  function bottoneOggi(n){
    var on = !!chiaveScelta(n);
    return '<button type="button" class="bottone b-oggi' + (on ? " on" : "") + '" data-stella="' + n._i + '" aria-pressed="' + on + '">' +
           ICONA_STELLA(on, 18) + (on ? "Tra le navi di oggi · togli" : "La visito oggi") + '</button>';
  }
  function collegaStelle(el){
    Array.prototype.forEach.call(el.querySelectorAll("[data-stella]"), function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        var n = NAVI && NAVI.navi[Number(b.getAttribute("data-stella"))];
        if(!n) return;
        var era = !!chiaveScelta(n);
        impostaScelta(n, !era);
        if(era && tab === "oggi") avvisa(n.nome + " tolta dalle navi di oggi.", function(){ impostaScelta(n, true); });
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll("[data-togli]"), function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        var q = b.getAttribute("data-togli"), s = sceltaAggiornata(), voce = s.navi[q];
        if(!voce) return;
        delete s.navi[q]; scrivi(CH_OGGI, s); aggiornaNavi();
        avvisa(voce.nome + " tolta dalle navi di oggi.", function(){ sceltaAggiornata().navi[q] = voce; scrivi(CH_OGGI, SCELTE); aggiornaNavi(); });
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll("[data-svuota]"), function(b){
      b.addEventListener("click", function(){
        var s = sceltaAggiornata(), prima = JSON.parse(JSON.stringify(s.navi)), k = Object.keys(prima).length;
        if(!k) return;
        s.navi = {}; scrivi(CH_OGGI, s); aggiornaNavi();
        avvisa(k === 1 ? "Tolta 1 nave dalla lista di oggi." : "Tolte " + k + " navi dalla lista di oggi.",
               function(){ sceltaAggiornata().navi = prima; scrivi(CH_OGGI, SCELTE); aggiornaNavi(); });
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll("[data-vai]"), function(b){
      b.addEventListener("click", function(){ impostaTab(b.getAttribute("data-vai")); });
    });
  }

  /* ================= VISITE (foglio Google condiviso) =================
     Il tasto "Visitata" scrive nel foglio "Navi visitate" tramite il suo script;
     l'elenco delle visite torna nell'app, cosi' tutti vedono le navi gia' fatte.
     Senza segnale le visite restano in coda sul telefono e partono dopo. */
  var FOGLIO = (window.CONFIG && window.CONFIG.foglioVisite) || null;
  var CH_VISITE = "porto_visite_v1", CH_CODA = "porto_visite_coda_v1", CH_NOME = "porto_nome_v1";
  var VISITE = leggi(CH_VISITE, { ultime: {}, recenti: [] });
  var CODA = leggi(CH_CODA, []);
  function chiaveNave(nome, imo){
    return /^\d{7}$/.test(String(imo || "")) ? "IMO" + imo : "N:" + String(nome || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  }
  function inizioSosta(n){
    if(n.in_porto_dal) return n.in_porto_dal;
    return n.arrivo_giorno || n.giorno || (NAVI && NAVI.data) || oggi();
  }
  /* la visita fatta durante questa sosta (dal foglio o ancora in coda), se c'e' */
  function visitaSosta(n){
    var k = chiaveNave(n.nome, n.imo), dal = inizioSosta(n);
    var tutte = (VISITE.recenti || []).concat(CODA.filter(function(c){ return c.azione === "visita"; }).map(function(c){
      var d = new Date(c.quando);
      return { data: oggiDi(d), ora: hhmm(d.getHours() * 60 + d.getMinutes()), nave: c.nave, imo: c.imo, id: c.id, da: c.da, inCoda: true };
    }));
    var annullate = CODA.filter(function(c){ return c.azione === "annulla"; }).map(function(c){ return c.id; });
    var trovata = null;
    tutte.forEach(function(v){
      if(annullate.indexOf(v.id) >= 0) return;
      if(!stessaNaveVisita(v, n, k)) return;
      if(v.data >= dal && (!trovata || v.data + v.ora > trovata.data + trovata.ora)) trovata = v;
    });
    return trovata;
  }
  /* La visita e' di questa nave? Con due IMO decide l'IMO; se uno manca (la nave e' stata segnata quando il giornale
     non aveva letto l'IMO, che poi e' arrivato dall'AIS) decide il nome. */
  function stessaNaveVisita(v, n, k){
    var iv = /^\d{7}$/.test(String(v.imo || "")), inn = /^\d{7}$/.test(String(n.imo || ""));
    if(iv && inn) return String(v.imo) === String(n.imo);
    return chiaveNave(v.nave, v.imo) === k || chiaveNave(v.nave, "") === chiaveNave(n.nome, "");
  }
  function oggiDi(d){ return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function visitata(n){ return !!visitaSosta(n); }
  /* l'ultima visita in una sosta precedente (es. "visitata 4 mesi fa") */
  function visitaPrecedente(n){
    var ul = VISITE.ultime || {};
    var u = ul[chiaveNave(n.nome, n.imo)] || ul[chiaveNave(n.nome, "")];
    if(!u || !u.data || u.data >= inizioSosta(n)) return null;
    return u;
  }
  function tempoFa(iso){
    var g = Math.round((new Date(oggi() + "T12:00:00") - new Date(iso + "T12:00:00")) / 864e5);
    if(g <= 0) return "oggi";
    if(g === 1) return "ieri";
    if(g < 31) return g + " giorni fa";
    var m = Math.round(g / 30.4);
    if(m < 12) return m === 1 ? "un mese fa" : m + " mesi fa";
    var a = Math.floor(g / 365);
    return a === 1 ? "un anno fa" : a + " anni fa";
  }
  function dataLunga(iso){ var p = String(iso || "").split("-"); return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : iso; }

  function caricaVisite(){
    if(!FOGLIO || !navigator.onLine) return Promise.resolve();
    return fetch(FOGLIO.url + "?codice=" + encodeURIComponent(FOGLIO.codice) + "&t=" + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){ if(d && d.ok){ VISITE = d; scrivi(CH_VISITE, d); aggiornaNavi(); } })
      .catch(function(){});
  }
  var inviando = false;
  function inviaCoda(){
    if(!FOGLIO || inviando || !CODA.length || !navigator.onLine) return Promise.resolve();
    inviando = true;
    var c = CODA[0];
    return fetch(FOGLIO.url, { method: "POST", body: JSON.stringify(Object.assign({ codice: FOGLIO.codice }, c)) })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d || !d.ok) throw new Error((d && d.errore) || "risposta");
        CODA.shift(); scrivi(CH_CODA, CODA);
      })
      .then(function(){ inviando = false; return CODA.length ? inviaCoda() : caricaVisite(); })
      .catch(function(){ inviando = false; });
  }
  function nuovoId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function segnaVisita(n){
    var t = trova(n.dove.terminal);
    var c = { azione: "visita", id: nuovoId(), quando: new Date().toISOString(), nave: n.nome, imo: n.imo || "",
              tipo: TIPI[n.tipo] || n.tipo || "", terminal: t ? t.nome : "", banchina: n.accosto || "",
              da: leggi(CH_NOME, "") || "" };
    CODA.push(c); scrivi(CH_CODA, CODA);
    aggiornaNavi(); inviaCoda();
    avvisa(n.nome + " segnata come visitata.", function(){ annullaVisita(c.id); });
  }
  function annullaVisita(id){
    var i = -1;
    CODA.forEach(function(c, k){ if(c.azione === "visita" && c.id === id) i = k; });
    if(i >= 0 && !(inviando && i === 0)) CODA.splice(i, 1);      // non ancora partita: basta toglierla
    else CODA.push({ azione: "annulla", id: id, quando: new Date().toISOString() });
    scrivi(CH_CODA, CODA);
    VISITE.recenti = (VISITE.recenti || []).filter(function(v){ return v.id !== id; });
    aggiornaNavi(); inviaCoda();
  }
  function bottoneVisita(n){
    if(!FOGLIO) return "";
    var v = visitaSosta(n);
    return v ? '<button type="button" class="bottone b-visitata" data-annulla="' + esc(v.id) + '">✓ Visitata · annulla</button>'
             : '<button type="button" class="bottone b-visita" data-visita="' + n._i + '">Visitata</button>';
  }
  function rigaVisite(n){
    var h = "", v = visitaSosta(n), pr = visitaPrecedente(n);
    if(v) h += '<p class="visita-riga ok">Visitata ' + (v.data === oggi() ? "oggi" : "il " + dataBreve(v.data)) + ' alle ' + esc(v.ora) +
               (v.da ? ' da ' + esc(v.da) : '') + (v.inCoda ? ' · in attesa di segnale' : '') + '</p>';
    if(pr) h += '<p class="visita-riga">Già visitata ' + tempoFa(pr.data) + ' (' + dataLunga(pr.data) + ')' +
                (pr.n > 1 ? ' · ' + pr.n + ' visite in tutto' : '') + '</p>';
    return h;
  }
  function collegaBottoniVisita(el){
    Array.prototype.forEach.call(el.querySelectorAll("[data-visita]"), function(b){
      b.addEventListener("click", function(e){ e.stopPropagation(); var n = NAVI.navi[Number(b.getAttribute("data-visita"))]; if(n) segnaVisita(n); });
    });
    Array.prototype.forEach.call(el.querySelectorAll("[data-annulla]"), function(b){
      b.addEventListener("click", function(e){ e.stopPropagation(); annullaVisita(b.getAttribute("data-annulla")); });
    });
  }
  window.addEventListener("online", function(){ inviaCoda(); caricaNavi(); });

  function avviaNavi(){
    caricaNavi();
    inviaCoda(); caricaVisite();
    setInterval(function(){ if(document.visibilityState === "visible"){ inviaCoda(); caricaVisite(); } }, 5 * 60 * 1000);
    // ogni 10 minuti si riprende il file (il server lo aggiorna ogni 15) e ogni minuto si ricalcola
    setInterval(function(){ if(document.visibilityState === "visible") caricaNavi(); }, 10 * 60 * 1000);
    setInterval(function(){ if(document.visibilityState === "visible") aggiornaNavi(); }, 60 * 1000);
    document.addEventListener("visibilitychange", function(){
      if(document.visibilityState === "visible"){ caricaNavi(); inviaCoda(); caricaVisite(); }
    });
  }

  if(pinRicordato) sblocca();

  if("serviceWorker" in navigator){
    try{ navigator.serviceWorker.register("sw.js"); }catch(e){}
  }
})();
};
</script>
