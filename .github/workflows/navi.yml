# Aggiorna le navi del giorno (giornale della Capitaneria + posizioni AIS)
# ogni 15 minuti dalle 7 alle 21, ora di Genova, e con un solo giro alle 23,
# alle 3 e alle 6 (ascolto AIS piu' lungo). Le navi vengono salvate solo
# cifrate (navi.enc.json) con il codice della mappa.
#
# GitHub fa partire le esecuzioni programmate in modo irregolare (a volte
# poche al giorno). Per questo di giorno ogni esecuzione resta accesa e fa da
# sola un giro ogni 15 minuti, fino alle 21 (al massimo 5 ore e mezza). Le
# partenze programmate ogni ora servono solo a riaccenderla se si e' fermata.
# Di notte la partenza oraria controlla se il giro previsto (23, 3 o 6) e' gia'
# stato fatto e, se no, lo fa: cosi' un'esecuzione saltata o in ritardo si
# recupera all'ora dopo. La decisione e' in strumenti/orario_giro.sh.
#
# Ogni giro riscrive il file delle navi. Per non riempire il deposito di
# versioni quasi uguali (56 al giorno), il commit fatto da questa stessa
# esecuzione al giro prima viene sovrascritto invece di aggiungerne un altro.
name: Navi del giorno

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      forza:
        description: "Rileggi il giornale anche se e' gia' stato letto"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: navi
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      # gli ultimi 30 commit: servono a sapere quando i dati sono stati aggiornati l'ultima volta
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Che cosa fare adesso (ora di Genova)
        id: orario
        env:
          EVENTO: ${{ github.event_name }}
        run: bash strumenti/orario_giro.sh >> "$GITHUB_OUTPUT"

      - name: Programmi per leggere il giornale
        if: steps.orario.outputs.vai == 'si'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr poppler-utils > /dev/null
          pip install -q -r strumenti/requisiti.txt

      - name: Giri (ogni 15 minuti dalle 7 alle 21, uno solo di notte)
        if: steps.orario.outputs.vai == 'si'
        env:
          CODICE_MAPPA: ${{ secrets.CODICE_MAPPA }}
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
          UN_GIRO: ${{ steps.orario.outputs.un_giro }}
        run: |
          git config user.name "aggiornamento-navi"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          INIZIO=$(date +%s)
          FINE_MAX=$((INIZIO + 5*3600 + 1800))
          FINE_SERA=$(TZ=Europe/Rome date -d "21:05" +%s)
          FINE=$(( FINE_MAX < FINE_SERA ? FINE_MAX : FINE_SERA ))
          OPZ="${{ inputs.forza && '--forza-giornale' || '' }}"
          ULTIMO_MIO=""
          pubblica() {
            git add navi.enc.json
            git diff --cached --quiet && return 0
            MSG="Navi aggiornate $(TZ=Europe/Rome date '+%d/%m %H:%M')"
            PREC=$(git rev-parse HEAD)
            # Si sovrascrive solo il commit che ha fatto questo stesso lavoro al giro prima: gia' pubblicato,
            # in testa a main e con un genitore vero (mai il primo commit di un clone corto, che
            # riscriverebbe la storia da zero). Altrimenti si aggiunge un commit nuovo.
            if [ -n "$ULTIMO_MIO" ] && [ "$PREC" = "$ULTIMO_MIO" ] \
               && [ "$(git rev-parse --abbrev-ref HEAD)" = "main" ] \
               && [ "$PREC" = "$(git rev-parse origin/main 2>/dev/null)" ] \
               && git rev-parse -q --verify HEAD^ > /dev/null; then
              git commit -q --amend -m "$MSG"
              # --force-with-lease: se nel frattempo qualcuno ha scritto su main, non si sovrascrive niente
              if git push -q --force-with-lease=refs/heads/main:"$PREC" origin HEAD:refs/heads/main; then
                ULTIMO_MIO=$(git rev-parse HEAD)
                return 0
              fi
              echo "sovrascrittura non riuscita (main e' cambiato): si aggiunge un commit nuovo"
              git reset -q --soft "$PREC"
            fi
            git commit -q -m "$MSG"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
            ULTIMO_MIO=$(git rev-parse HEAD)
          }
          while true; do
            GIRO=$(date +%s)
            git pull -q --rebase || true
            python3 strumenti/aggiorna_navi.py $OPZ || echo "giro non riuscito, si riprova al prossimo"
            OPZ=""
            pubblica
            if [ "$UN_GIRO" = "si" ]; then echo "Giro notturno fatto"; break; fi
            PROSSIMO=$((GIRO + 900))
            if [ "$PROSSIMO" -ge "$FINE" ]; then echo "Fine dei giri"; break; fi
            ATTESA=$((PROSSIMO - $(date +%s))); [ "$ATTESA" -gt 0 ] && sleep "$ATTESA"
          done
