# Aggiorna le navi (giornale della Capitaneria + posizioni AIS), ora di Genova:
# di giorno un giro ogni 15 minuti dalle 7:00 alle 20:45, di notte un solo giro
# alle 23, alle 3 e alle 6 (ascolto AIS piu' lungo). Le navi vengono salvate solo
# cifrate con il codice della mappa: navi.enc.json (quello che scarica l'app) e
# stato.enc.json (la memoria del programma, che l'app non scarica).
#
# STAFFETTA. GitHub fa partire le esecuzioni programmate quando vuole: il 27-28/10
# su circa 20 partenze orarie ne ha fatte 3. Per questo l'aggiornamento non dipende
# piu' da loro: ogni esecuzione resta accesa al massimo 5 ore, aspetta gli orari dei
# giri (strumenti/orario_giro.py) e prima di chiudersi fa partire quella dopo
# ("passa il testimone"). Le due esecuzioni non girano mai insieme (concurrency):
# la nuova aspetta che la vecchia finisca. Un giro saltato o in ritardo si fa appena
# possibile, uno gia' fatto non si rifa'. La partenza oraria resta solo di riserva,
# per riaccendere la staffetta se si fosse interrotta (per esempio se qualcuno
# annulla l'esecuzione in corso). Le esecuzioni di riserva arrivate mentre la
# staffetta va compaiono come annullate: e' normale.
#
# Ogni giro riscrive i file delle navi. Per non riempire il deposito di versioni
# quasi uguali, il commit fatto da questa stessa esecuzione al giro prima viene
# sovrascritto invece di aggiungerne un altro.
#
# Le modifiche a questo file valgono dall'esecuzione successiva (la staffetta la
# avvia sempre con la versione piu' recente su main).
name: Navi del giorno

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      subito:
        description: "Fai subito un giro (senza aspettare il prossimo orario)"
        type: boolean
        default: true
      forza:
        description: "Rileggi il giornale anche se e' gia' stato letto"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write          # per far partire l'esecuzione successiva (staffetta)

concurrency:
  group: navi
  cancel-in-progress: false

jobs:
  aggiorna:
    # versione fissa: ubuntu-latest passa a Ubuntu 26.04 (Python 3.14) tra il 19/10 e il 19/11/2026
    # e i programmi del giornale (numpy<2.3) non hanno versioni pronte per Python 3.14
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Inizio
        run: echo "INIZIO_LAVORO=$(date +%s)" >> "$GITHUB_ENV"

      # gli ultimi 30 commit: servono a sapere quando i dati sono stati aggiornati l'ultima volta
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Programmi per leggere il giornale
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr poppler-utils > /dev/null
          pip install -q -r strumenti/requisiti.txt

      - name: Giri (ogni 15 minuti di giorno, alle 23, 3 e 6 di notte)
        env:
          CODICE_MAPPA: ${{ secrets.CODICE_MAPPA }}
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
          SUBITO: ${{ github.event_name == 'workflow_dispatch' && inputs.subito && 'si' || 'no' }}
          STATO_SEPARATO: "si"    # la memoria del programma in stato.enc.json, al telefono solo navi.enc.json
        run: |
          git config user.name "aggiornamento-navi"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          INIZIO=$(date +%s)
          # dopo 5 ore il prossimo giro tocca all'esecuzione dopo (limite di GitHub: 6 ore per esecuzione)
          FINE=$((INIZIO + 5*3600))
          OPZ="${{ inputs.forza && '--forza-giornale' || '' }}"
          if [ "$SUBITO" = "si" ]; then
            ULTIMO=0                                   # avvio a mano: un giro subito
          else
            ULTIMO=$(git log -1 --format=%ct --grep='^Navi aggiornate' 2>/dev/null || true)
          fi
          ULTIMO=${ULTIMO:-0}
          ULTIMO_MIO=""
          pubblica() {
            git add navi.enc.json
            if [ -f stato.enc.json ]; then git add stato.enc.json; fi
            git diff --cached --quiet && return 0
            MSG="Navi aggiornate $(TZ=Europe/Rome date '+%d/%m %H:%M')"
            PREC=$(git rev-parse HEAD)
            # Si sovrascrive solo il commit che ha fatto questo stesso lavoro al giro prima: gia' pubblicato,
            # in testa a main e con un genitore vero (mai il primo commit di un clone corto, che
            # riscriverebbe la storia da zero). Altrimenti si aggiunge un commit nuovo.
            if [ -n "$ULTIMO_MIO" ] && [ "$PREC" = "$ULTIMO_MIO" ] \
               && [ "$(git rev-parse --abbrev-ref HEAD)" = "main" ] \
               && [ "$PREC" = "$(git rev-parse origin/main 2>/dev/null)" ] \
               && git rev-parse -q --verify HEAD^ > /dev/null; then
              git commit -q --amend -m "$MSG"
              # --force-with-lease: se nel frattempo qualcuno ha scritto su main, non si sovrascrive niente
              if git push -q --force-with-lease=refs/heads/main:"$PREC" origin HEAD:refs/heads/main; then
                ULTIMO_MIO=$(git rev-parse HEAD)
                return 0
              fi
              echo "sovrascrittura non riuscita (main e' cambiato): si aggiunge un commit nuovo"
              git reset -q --soft "$PREC"
            fi
            git commit -q -m "$MSG"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
            ULTIMO_MIO=$(git rev-parse HEAD)
          }
          while true; do
            ADESSO=$(date +%s)
            ATTESA=$(python3 strumenti/orario_giro.py attesa "$ULTIMO" "$ADESSO" || echo 900)
            python3 strumenti/orario_giro.py descrivi "$ULTIMO" "$ADESSO" || true
            if [ $((ADESSO + ATTESA)) -ge "$FINE" ]; then
              echo "Il prossimo giro tocca all'esecuzione dopo"; break
            fi
            if [ "$ATTESA" -gt 0 ]; then sleep "$ATTESA"; fi
            git pull -q --rebase || true
            python3 strumenti/aggiorna_navi.py $OPZ || echo "giro non riuscito, si riprova al prossimo"
            OPZ=""
            pubblica
            ULTIMO=$(date +%s)
          done

      # La staffetta: si avvia l'esecuzione dopo, che aspetta la fine di questa e continua dai suoi orari.
      # Anche se un passo e' andato male (ma non se qualcuno ha annullato l'esecuzione a mano). Se questa e' durata
      # pochissimo (qualcosa si rompe subito) si aspetta un po', per non fare partenze a raffica.
      - name: Passa il testimone all'esecuzione dopo
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PASSATI=$(( $(date +%s) - INIZIO_LAVORO ))
          if [ "$PASSATI" -lt 600 ]; then sleep $((600 - PASSATI)); fi
          for i in 1 2 3; do
            if gh workflow run navi.yml --repo "$GITHUB_REPOSITORY" --ref main -f subito=false; then
              echo "Testimone passato: l'esecuzione dopo parte appena finisce questa"; exit 0
            fi
            sleep 30
          done
          echo "::warning title=Staffetta interrotta::Esecuzione dopo non avviata: ripartira' con la partenza programmata di GitHub"
