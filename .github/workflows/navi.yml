# Aggiorna le navi del giorno (giornale della Capitaneria + posizioni AIS)
# ogni 30 minuti dalle 7 alle 21, ora di Genova. Le navi vengono salvate
# solo cifrate (navi.enc.json) con il codice della mappa.
name: Navi del giorno

on:
  schedule:
    - cron: "*/30 4-20 * * *"     # UTC: copre 7-21 sia con l'ora solare sia con quella legale
  workflow_dispatch:
    inputs:
      forza:
        description: "Rileggi il giornale anche se e' gia' stato letto"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: navi
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Solo dalle 7 alle 21 (ora di Genova)
        id: orario
        run: |
          ORA=$(TZ=Europe/Rome date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$ORA" -ge 7 ] && [ "$ORA" -le 21 ]; }; then
            echo "vai=si" >> "$GITHUB_OUTPUT"
          else
            echo "Fuori orario ($ORA)"; echo "vai=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.orario.outputs.vai == 'si'

      - name: Programmi per leggere il giornale
        if: steps.orario.outputs.vai == 'si'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr poppler-utils > /dev/null
          pip install -q -r strumenti/requisiti.txt

      - name: Aggiorna le navi
        if: steps.orario.outputs.vai == 'si'
        env:
          CODICE_MAPPA: ${{ secrets.CODICE_MAPPA }}
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
        run: |
          python3 strumenti/aggiorna_navi.py ${{ inputs.forza && '--forza-giornale' || '' }}

      - name: Pubblica
        if: steps.orario.outputs.vai == 'si'
        run: |
          git config user.name "aggiornamento-navi"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navi.enc.json
          if git diff --cached --quiet; then echo "Niente di nuovo"; exit 0; fi
          git commit -q -m "Navi aggiornate $(TZ=Europe/Rome date '+%d/%m %H:%M')"
          # se nel frattempo e' stato caricato qualcos'altro, ci si rimette in pari
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
